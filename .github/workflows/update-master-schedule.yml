name: Update Master Schedule

on:
  push:
    paths:
      - 'Input/Personal_Schedule.xlsx'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update-master-schedule.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create calendar input and build master
        run: python scripts/calendar_schedule.py

      - name: Run tests
        run: pytest -q

      - name: Upload calendar input
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Schedule-Calendar
          path: Input/Personal_Schedule.xlsx
          if-no-files-found: error

      - name: Upload generated master schedule
        uses: actions/upload-artifact@v4
        with:
          name: Master-Schedule
          path: Output/Master_Schedule.xlsx
          if-no-files-found: error
