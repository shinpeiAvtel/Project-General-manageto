name: Update Master Schedule

on:
  push:
    paths:
      - 'Input/Personal_Schedule.xlsx'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build schedule workbook
        run: python scripts/build_schedule.py

      - name: Run tests
        run: pytest -q

      - name: Upload generated master schedule
        uses: actions/upload-artifact@v4
        with:
          name: Master-Schedule
          path: Output/Master_Schedule.xlsx
          if-no-files-found: error
